name: Aggiorna spesa

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.GH_READ_TOKEN != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Leggi i job Ubicloud
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          GH_ORG: ${{ vars.GH_ORG }}
          START_DATE: ${{ vars.START_DATE }}
        run: python3 collect.py

      - name: Salva i dati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "dati $(date -u +%Y-%m-%dT%H:%MZ)" && git push; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
